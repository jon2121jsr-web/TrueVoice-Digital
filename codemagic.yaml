# Candidate root codemagic.yaml for the dedicated CI branch only.
# No events, publishing, signing, integrations, or credential groups.
workflows:
  ios-native-validation:
    name: ios-native-validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    when:
      condition: env.CM_BRANCH == "ci/ios-native-validation-1b03f"
    environment:
      xcode: "26.2"
      node: "24.14.0"
      cocoapods: "1.16.2"
      vars:
        # Non-secret, nonfunctional fixtures: compilation only, no app launch.
        VITE_SUPABASE_URL: "https://native-validation.invalid"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_validation_only_not_a_real_key"
        NODE_OPTIONS: "--max-old-space-size=512"
    scripts:
      - name: Verify branch, source manifest and unsigned environment
        script: node ci/native-validation/run.mjs preflight
      - name: Install exact locked Node dependencies
        script: node ci/native-validation/run.mjs dependencies
      - name: Run seven Swift policy tests
        script: node ci/native-validation/run.mjs swift-tests
      - name: Run npm build and inspect emitted timing
        script: node ci/native-validation/run.mjs web-build
      - name: Sync Capacitor and resolve CocoaPods
        script: node ci/native-validation/run.mjs sync
      - name: Compile unsigned Debug iOS Simulator application
        script: node ci/native-validation/run.mjs compile
    artifacts:
      # Sanitized text/JSON only; no .app, IPA, archive, keys or raw workspace.
      - .native-validation/ci/logs/*.log
      - .native-validation/ci/reports/*.json

  ios-release-archive-validation:
    name: ios-release-archive-validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    when:
      condition: env.CM_BRANCH == "release/ios-testflight-1b04"
    environment:
      xcode: "26.2"
      node: "24.14.0"
      cocoapods: "1.16.2"
      groups:
        - pulse_ios_public_runtime
    scripts:
      - name: Verify release source, approved public inputs and unsigned environment
        script: node ci/ios-release/validate.mjs preflight
      - name: Install locked npm dependencies
        script: node ci/ios-release/validate.mjs dependencies
      - name: Execute seven Swift policy tests
        script: node ci/ios-release/validate.mjs swift-tests
      - name: Build real web assets with approved runtime inputs
        script: node ci/ios-release/validate.mjs web-build
      - name: Sync Capacitor and resolve CocoaPods
        script: node ci/ios-release/validate.mjs sync
      - name: Validate unsigned Release device archive - not distributable
        script: node ci/ios-release/validate.mjs archive
    artifacts:
      - .native-validation/release/logs/*.log
      - .native-validation/release/reports/*.json
